<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Simulador VR · Incendios Tunari</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(16, 20, 26, 0.78);
    --panel-border: rgba(255,255,255,0.08);
    --accent: #ff7a33;
    --accent-soft: rgba(255, 122, 51, 0.18);
    --text: #eef3f6;
    --text-dim: #9aa7b0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0f14; }
  body { font-family: 'Segoe UI', Roboto, -apple-system, Arial, sans-serif; color: var(--text); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
  }

  /* ---------- marca, arriba a la izquierda ---------- */
  #brand {
    position: fixed; left: 14px; top: 14px; z-index: 10;
    display: flex; align-items: center; gap: 9px; max-width: 46vw;
    padding: 9px 14px; pointer-events: none;
    opacity: 0; transition: opacity .6s ease;
  }
  #brand .flame { font-size: 18px; filter: drop-shadow(0 0 6px rgba(255,122,51,.7)); }
  #brand .txt { font-size: 12px; line-height: 1.25; }
  #brand .txt b { color: var(--accent); display: block; font-size: 12.5px; letter-spacing: .02em; }
  #brand .txt span { color: var(--text-dim); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }

  /* ---------- panel de estadísticas, arriba a la derecha ---------- */
  #stats {
    position: fixed; right: 14px; top: 14px; z-index: 10;
    padding: 12px 16px; font-size: 12.5px; min-width: 188px;
    opacity: 0; transform: translateY(-6px); transition: opacity .5s ease, transform .5s ease;
  }
  #stats .row { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0; }
  #stats .row + .row { border-top: 1px solid rgba(255,255,255,0.06); }
  #stats .label { color: var(--text-dim); }
  #stats .val { font-weight: 700; }
  #stats .val.on { color: var(--accent); }
  #stats.visible, #brand.visible { opacity: 1; transform: none; }

  /* ---------- barra de control inferior ---------- */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
    pointer-events: none;
    opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease;
  }
  #hud.visible { opacity: 1; transform: none; }

  #timeline {
    pointer-events: auto; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; width: min(520px, 94vw);
  }
  #timeline input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
  #timeClock { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 56px; text-align: right; color: var(--text-dim); }

  #toolbar { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 7px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
  #toolbar .sep { width: 1px; height: 26px; background: var(--panel-border); margin: 0 2px; }

  button.ui {
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--text); background: rgba(255,255,255,0.05); border: 1px solid transparent;
    padding: 10px 13px; border-radius: 11px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: transform .12s ease, background .15s ease, border-color .15s ease;
  }
  button.ui .ic { font-size: 15px; line-height: 1; }
  button.ui:hover { background: rgba(255,255,255,0.09); }
  button.ui:active { transform: scale(0.95); }
  button.ui.active { background: var(--accent-soft); border-color: var(--accent); color: #ffcba8; }
  button.ui.vr { background: rgba(76,175,80,0.14); border-color: rgba(76,175,80,.55); }
  button.ui.round { padding: 10px; border-radius: 50%; }
  button.ui:disabled { opacity: .45; cursor: default; }

  /* ---------- pantalla de carga ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 60; background: radial-gradient(ellipse at 50% 40%, #1a1510 0%, #0a0f14 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 16px;
  }
  #loading .flameLoad { font-size: 38px; animation: flicker 1.3s ease-in-out infinite; }
  #loading .txt { color: var(--text-dim); font-size: 13.5px; letter-spacing: .02em; }
  @keyframes flicker { 0%,100%{ transform: scale(1) rotate(-1deg); opacity:1;} 50%{ transform: scale(1.08) rotate(1deg); opacity:.85;} }

  /* ---------- intro del dron ---------- */
  #introCaption {
    position: fixed; left: 0; right: 0; bottom: 42px; z-index: 20;
    display: none; align-items: center; justify-content: center; gap: 10px;
    pointer-events: none;
  }
  #introCaption .panel2 {
    background: rgba(10,13,17,0.65); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 999px;
    padding: 10px 20px; font-size: 13px; letter-spacing: .03em; color: #ffe3cc;
    display: flex; align-items: center; gap: 10px; transition: opacity .4s ease;
  }
  #introCaption .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3; transform: scale(.8);} 50%{opacity:1; transform: scale(1.15);} }

  #btnSkipIntro {
    position: fixed; right: 16px; top: 16px; z-index: 20; display: none;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text);
    background: rgba(10,13,17,0.6); border: 1px solid rgba(255,255,255,.15);
    padding: 9px 16px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px);
  }
  #btnSkipIntro:active { transform: scale(0.96); }

  @media (max-width: 480px) {
    #brand .txt b { font-size: 11px; }
    #brand .txt span { font-size: 9px; }
    #brand .flame { font-size: 15px; }
    #stats { min-width: 150px; font-size: 11px; padding: 9px 12px; right: 10px; top: 10px; }
    #brand { left: 10px; top: 10px; padding: 7px 10px; max-width: 42vw; }
    button.ui { font-size: 11.5px; padding: 9px 10px; }
  }

  #fallbackNotice {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    z-index: 10; color: #ffd7b0; background: rgba(60, 28, 8, .6); border: 1px solid rgba(255,138,76,.35);
    padding: 7px 14px; border-radius: 999px; font-size: 12px; display: none; pointer-events: none;
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
  <div id="loading">
    <div class="flameLoad">🔥</div>
    <div class="txt">Cargando el terreno real del sector Cercado…</div>
  </div>

  <div id="app"></div>

  <div id="brand">
    <span class="flame">🔥</span>
    <div class="txt"><b>Incendios Tunari · VR</b><span>SIM-522 · Grupo 3</span></div>
  </div>

  <div id="stats" class="panel">
    <div class="row"><span class="label">Escenario</span><span class="val" id="statEscenario">Base</span></div>
    <div class="row"><span class="label">Hectáreas quemadas</span><span class="val" id="statHa">0.0 ha</span></div>
    <div class="row"><span class="label">¿Llega a viviendas?</span><span class="val" id="statLlega">—</span></div>
    <div class="row"><span class="label">Tiempo simulado</span><span class="val" id="statTiempo">0 min</span></div>
  </div>

  <div id="hud">
    <div id="timeline" class="panel">
      <button class="ui round" id="btnPlay"><span class="ic">⏸</span></button>
      <input type="range" id="scrub" min="0" max="100" value="0" />
      <span id="timeClock">00:00</span>
    </div>
    <div id="toolbar" class="panel">
      <button class="ui active" id="btnBase"><span class="ic">🔥</span>Sin intervención</button>
      <button class="ui" id="btnCortafuegos"><span class="ic">🚧</span>Cortafuegos 250 m</button>
      <button class="ui" id="btnRiesgo"><span class="ic">📊</span>Mapa de riesgo</button>
      <div class="sep"></div>
      <button class="ui vr" id="btnVR"><span class="ic">🥽</span>Entrar en VR</button>
      <button class="ui" id="btnStereo"><span class="ic">📱</span>Cardboard manual</button>
    </div>
  </div>

  <button id="btnSkipIntro">Saltar intro ⏭</button>
  <div id="introCaption"><div class="panel2"><span class="dot"></span><span class="capTxt">Preparando el dron térmico…</span></div></div>

  <div id="fallbackNotice">Modo Cardboard manual activo — mueve el celular para mirar alrededor. Toca para salir.</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/build/three.module.js",
      "three/addons/": "./libs/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
